# ===== Profile de produção (AWS) — ativado com SPRING_PROFILES_ACTIVE=prod =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frota}
spring.datasource.username=${DB_USERNAME:frota}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# As tabelas são criadas pelo script deploy/banco.sql.
# "validate" só confere se as tabelas batem com as entidades (não altera nada).
spring.jpa.hibernate.ddl-auto=validate
