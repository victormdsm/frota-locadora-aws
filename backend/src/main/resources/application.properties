spring.application.name=demo

# Porta (na AWS dá pra trocar com a variável PORT)
server.port=${PORT:8080}

# ===== SQLite =====
# Em produção (EC2) aponte DB_URL para um caminho persistente, ex: jdbc:sqlite:/opt/frota/frota.db
spring.datasource.url=${DB_URL:jdbc:sqlite:./data/frota.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ===== Segurança / JWT =====
# Mínimo de 32 caracteres. EM PRODUÇÃO SEMPRE defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-32-caracteres-ou-mais}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Origens liberadas no CORS (separadas por vírgula). Ex: http://meu-bucket.s3-website-us-east-1.amazonaws.com
app.cors.origens=${CORS_ORIGINS:http://localhost:4200}

# ===== Usuários criados na primeira subida (seed) =====
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.senha=${ADMIN_PASSWORD:admin123}
app.seed.usuario.username=${USER_USERNAME:usuario}
app.seed.usuario.senha=${USER_PASSWORD:usuario123}
