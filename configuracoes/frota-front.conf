# /etc/apache2/sites-available/frota-front.conf
<VirtualHost *:80>
    DocumentRoot /var/www/frota/browser

    <Directory /var/www/frota/browser>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Rotas do Angular (/login, /sistema/carros...) caem no index.html
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/frota-error.log
    CustomLog ${APACHE_LOG_DIR}/frota-access.log combined
</VirtualHost>
