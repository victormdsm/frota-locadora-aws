<div class="login-fundo">
    <div class="card login-card shadow-5">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <span class="marca mb-3"><i class="fas fa-car-side"></i></span>
                <h4 class="mb-1">Frota Locadora</h4>
                <p class="text-muted small mb-0">Entre para gerenciar a frota e as locações</p>
            </div>

            <form (ngSubmit)="logar()">
                <mdb-form-control class="mb-3">
                    <input mdbInput type="text" id="usuario" name="usuario" class="form-control"
                           autocomplete="username" [(ngModel)]="usuario" />
                    <label mdbLabel class="form-label" for="usuario">Usuário</label>
                </mdb-form-control>
                <mdb-form-control class="mb-3">
                    <input mdbInput type="password" id="senha" name="senha" class="form-control"
                           autocomplete="current-password" [(ngModel)]="senha" />
                    <label mdbLabel class="form-label" for="senha">Senha</label>
                </mdb-form-control>

                @if (erro) {
                    <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
                }

                <button type="submit" class="btn btn-primary btn-block" [disabled]="carregando">
                    @if (carregando) {
                        <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>
