<div class="container mt-4">
    <h3 class="mb-3">Marcas</h3>
    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h6 class="mb-3">{{ marcaEdit.id ? 'Editar marca' : 'Nova marca' }}</h6>
                    <form (ngSubmit)="salvar()">
                        <label class="form-label small text-muted" for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control mb-3" [(ngModel)]="marcaEdit.nome" />
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" [disabled]="!marcaEdit.nome?.trim()">
                                <i class="fas fa-save me-1"></i>Salvar</button>
                            @if (marcaEdit.id) {
                                <button type="button" class="btn btn-light" (click)="limpar()">Cancelar</button>
                            }
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr><th>ID</th><th>Nome</th><th class="text-end">Ações</th></tr>
                        </thead>
                        <tbody>
                            @for (marca of lista; track marca.id) {
                            <tr>
                                <td class="text-muted">{{ marca.id }}</td>
                                <td>{{ marca.nome }}</td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-link btn-sm px-2" title="Editar" (click)="editar(marca)"><i class="fas fa-pen"></i></button>
                                    <button type="button" class="btn btn-link btn-sm px-2 text-danger" title="Excluir" (click)="deletar(marca)"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
