<form (ngSubmit)="enviar()">
    <div class="d-flex align-items-center p-3 mb-3 rounded bg-light">
        <i class="fas fa-car-side fa-2x text-primary me-3"></i>
        <div>
            <div class="fw-bold">{{ carro.marca?.nome }} {{ carro.modelo }}</div>
            <div class="small text-muted">{{ carro.placa }} · {{ carro.ano }} · {{ carro.valorDiaria | currency:'BRL' }}/dia</div>
        </div>
    </div>

    @if (admin) {
        <div class="mb-3">
            <label class="form-label small text-muted" for="cliente">Locar para</label>
            <select id="cliente" name="cliente" class="form-select" [(ngModel)]="usuarioId">
                <option [ngValue]="undefined">Eu mesmo (administrador)</option>
                @for (u of usuarios; track u.id) {
                    @if (u.role === 'USER') {
                        <option [ngValue]="u.id">{{ u.nome }} ({{ u.username }})</option>
                    }
                }
            </select>
        </div>
    }

    <div class="row g-3">
        <div class="col-6">
            <label class="form-label small text-muted" for="inicio">Retirada</label>
            <input type="date" id="inicio" name="inicio" class="form-control" [min]="hoje" [(ngModel)]="dataInicio" />
        </div>
        <div class="col-6">
            <label class="form-label small text-muted" for="fim">Devolução prevista</label>
            <input type="date" id="fim" name="fim" class="form-control" [min]="dataInicio" [(ngModel)]="dataFimPrevista" />
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 p-3 rounded border">
        <span class="text-muted">{{ dias }} diária(s)</span>
        <span class="fs-5 fw-bold text-primary">{{ valorEstimado | currency:'BRL' }}</span>
    </div>

    <div class="text-end mt-4">
        <button type="submit" class="btn btn-success" [disabled]="!datasValidas">
            <i class="fas fa-check me-1"></i>Confirmar locação</button>
    </div>
</form>
